services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal_dev
      POSTGRES_DB: journal
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - journal-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  journal-dev-db:
