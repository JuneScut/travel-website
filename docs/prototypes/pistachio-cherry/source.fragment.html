#art-stamp-directions .variant {min-height:800px;}
#art-stamp-directions .palette {display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:12px 0 18px;color:var(--foreground);font:400 12px/1.6 sans-serif;}
#art-stamp-directions .dot {width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:6px;background:var(--chip);border-radius:50%;}
#art-stamp-directions .page {--active-photo:var(--kyoto);background:var(--paper);color:var(--ink);font:400 14px/1.7 'Noto Sans SC',sans-serif;min-height:720px;}
#art-stamp-directions .page * {box-sizing:border-box;}
#art-stamp-directions .page h1,#art-stamp-directions .page h2,#art-stamp-directions .page p {margin:0;font-weight:400;}
#art-stamp-directions .page a {color:inherit;text-decoration:none;}
#art-stamp-directions .page .display {font-family:var(--display),'Noto Serif SC','Songti SC',serif;}
#art-stamp-directions .page .zh {font-family:'Noto Serif SC','Songti SC',serif;}
#art-stamp-directions .mast {display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 34px;}
#art-stamp-directions .brand {font-family:'Noto Serif SC',serif;font-size:25px;white-space:nowrap;}
#art-stamp-directions .brand small {font:400 11px sans-serif;letter-spacing:2px;margin-left:10px;}
#art-stamp-directions .mast nav {display:flex;gap:23px;flex-wrap:wrap;font-size:12px;}
#art-stamp-directions .micro {font-size:11px;letter-spacing:1.5px;}
#art-stamp-directions .photo {background:var(--active-photo) center 46% / cover;min-width:0;}
#art-stamp-directions .stamp-index {display:flex;justify-content:center;gap:24px;align-items:center;}
#art-stamp-directions .stamp {background:none;border:0;padding:0;width:112px;min-width:0;color:var(--ink);font:400 11px/1.5 'Noto Sans SC',sans-serif;position:relative;}
#art-stamp-directions .stamp-face {display:block;clip-path:var(--cut);background:var(--stamp-paper);padding:9px 9px 12px;transition:transform .22s ease;}
#art-stamp-directions .stamp-art {display:block;height:108px;background:var(--signal);position:relative;overflow:hidden;}
#art-stamp-directions .stamp-art:before,#art-stamp-directions .stamp-art:after {content:'';position:absolute;}
#art-stamp-directions .stamp[data-trip=lisbon] .stamp-art {background:var(--secondary);}
#art-stamp-directions .stamp[data-trip=lisbon] .stamp-art:before {width:110%;height:90%;border:18px solid var(--signal);border-radius:60% 60% 0 0;left:13%;top:28%;transform:rotate(-20deg);}
#art-stamp-directions .stamp[data-trip=kyoto] .stamp-art:before {width:64px;height:64px;border-radius:50%;background:var(--secondary);left:15%;top:12%;}
#art-stamp-directions .stamp[data-trip=kyoto] .stamp-art:after {width:110%;height:38px;background:var(--ink);left:-5%;bottom:5%;transform:rotate(-20deg);}
#art-stamp-directions .stamp[data-trip=iceland] .stamp-art {background:var(--ink);}
#art-stamp-directions .stamp[data-trip=iceland] .stamp-art:before {width:75%;height:120%;background:var(--secondary);left:-25%;top:-10%;transform:rotate(25deg);}
#art-stamp-directions .stamp[data-trip=iceland] .stamp-art:after {width:45px;height:45px;border-radius:50%;background:var(--signal);right:8%;bottom:10%;}
#art-stamp-directions .stamp[data-trip=paris] .stamp-art {background:var(--secondary);}
#art-stamp-directions .stamp[data-trip=paris] .stamp-art:before {width:70px;height:70px;border-radius:50%;border:18px solid var(--ink);left:15%;top:16%;}
#art-stamp-directions .stamp[data-trip=paris] .stamp-art:after {width:110%;height:25px;background:var(--signal);bottom:7%;left:-5%;transform:rotate(20deg);}
#art-stamp-directions .stamp .stamp-city {display:block;margin-top:8px;letter-spacing:1.2px;}
#art-stamp-directions .stamp .stamp-date {display:block;font-size:11px;}
#art-stamp-directions .stamp[aria-pressed=true] .stamp-face {transform:translateY(-9px) rotate(-4deg);}
#art-stamp-directions .stamp[aria-pressed=true] .stamp-city:after {content:' ↗';}
#art-stamp-directions .stamp:hover .stamp-face {transform:translateY(-9px) rotate(3deg);}
#art-stamp-directions .journey-detail {font-size:13px;}
#art-stamp-directions .journey-detail h2 {font-family:'Noto Serif SC',serif;font-size:25px;line-height:1.55;margin:9px 0;}
#art-stamp-directions .journey-detail p {max-width:34ch;line-height:1.85;}
#art-stamp-directions .journey-detail .route {font-size:11px;margin-top:14px;letter-spacing:.8px;}
#art-stamp-directions .citrus {--paper:#fff3a3;--signal:#ed398c;--secondary:#ff7a3f;--ink:#482c46;--stamp-paper:#fffced;--display:'Fraunces';}
#art-stamp-directions .citrus .mast {background:var(--signal);}
#art-stamp-directions .citrus .hero {padding:25px 34px 28px;text-align:center;}
#art-stamp-directions .citrus h1 {font-size:82px;line-height:.95;letter-spacing:-3px;margin:12px 0 17px;}
#art-stamp-directions .citrus h1 em {color:var(--signal);font-weight:500;}
#art-stamp-directions .citrus .stamp-index {padding:15px 0 10px;gap:35px;}
#art-stamp-directions .citrus .strip {display:grid;grid-template-columns:1.1fr 1fr;margin:0 34px 28px;background:var(--signal);}
#art-stamp-directions .citrus .photo {height:207px;}
#art-stamp-directions .citrus .journey-detail {padding:18px 25px;}
#art-stamp-directions .sea {--paper:#d8f0ff;--signal:#ff5073;--secondary:#f9d467;--ink:#193a55;--stamp-paper:#fffdf6;--display:'DM Serif Display';}
#art-stamp-directions .sea .mast {border-bottom:1px solid var(--ink);}

<div id="art-stamp-directions" aria-label="开心果樱桃独立刊物首页原型">
<section class="variant" data-variant="开心果樱桃独立刊物" aria-label="开心果樱桃独立刊物">
  <div class="palette"><span><i class="dot" style="--chip:#ddef7d"></i>开心果 #DDEF7D</span><span><i class="dot" style="--chip:#e73759"></i>樱桃 #E73759</span><span><i class="dot" style="--chip:#ffa4ce"></i>草莓奶昔 #FFA4CE</span><span>Fraunces × 宋体 · 摄影独立刊物</span></div>
  <div class="page pistachio" aria-label="开心果樱桃独立刊物配色">
   <header class="mast"><div class="brand">旅迹 <small>JOURNAL</small></div><nav aria-label="网站导航"><a href="#pistachio-index">旅程</a><a href="#pistachio-story">沿途光影</a><a href="#pistachio-story">世界足迹 ↗</a></nav></header>
   <div class="headline"><h1 class="display">Out of <em>office.</em></h1><p>去远方，收集日常之外。<br>PHOTOGRAPHIC JOURNAL / 2026</p></div>
   <div class="edition"><div id="pistachio-index" class="stamp-index" aria-label="选择旅程邮票"></div><div class="article" id="pistachio-story"><div class="photo" role="img" aria-label="当前旅程照片"></div><article class="journey-detail" aria-live="polite"><div><span class="micro" data-field="kicker"></span><h2 data-field="title"></h2></div><div><p data-field="description"></p><div class="route" data-field="route"></div></div></article></div></div>
  </div>
 </section>
</div>
<template id="art-stamp-template"><button class="stamp cursor-interaction" type="button"><span class="stamp-face" aria-hidden="true"><span class="stamp-art"></span></span><span class="stamp-city"></span><span class="stamp-date"></span></button></template>
<script>
(() => {
 const root=document.getElementById('art-stamp-directions');
 const template=document.getElementById('art-stamp-template');
 const trips=[
  {id:'lisbon',city:'里斯本',latin:'LISBON',date:'03.12 — 03.17',title:'里斯本 · 有风的坡道',description:'黄色电车沿着石板路慢慢爬升。海风把晾晒的衣物吹得很轻。',route:'阿尔法玛 → 贝伦 → 辛特拉'},
  {id:'kyoto',city:'京都',latin:'KYOTO',date:'04.18 — 04.26',title:'京都 · 雨后的青石路',description:'雨停之后，街灯在潮湿的石板路上留下很长的倒影，城市的声音也慢了下来。',route:'京都 → 奈良 → 大阪 → 东京'},
  {id:'iceland',city:'冰岛',latin:'ICELAND',date:'02.08 — 02.16',title:'冰岛 · 黑沙与海风',description:'浪在黑色海岸线上一次次退回去，远处的山藏在低低的云层里。',route:'雷克雅未克 → 维克 → 杰古沙龙'},
  {id:'paris',city:'巴黎',latin:'PARIS',date:'10.03 — 10.09',title:'巴黎 · 左岸书店',description:'傍晚的光落在旧书页上，塞纳河边的人们开始收起一天的脚步。',route:'玛黑区 → 蒙马特 → 左岸'}
 ];
 root.querySelectorAll('.page').forEach(page=>{
  const index=page.querySelector('.stamp-index');
  function select(trip){
   page.style.setProperty('--active-photo',`var(--${trip.id})`);
   const fields={...trip,kicker:`${trip.latin} / ${trip.date}`};
   page.querySelectorAll('[data-field]').forEach(el=>el.textContent=fields[el.dataset.field] || '');
   page.querySelector('.photo').setAttribute('aria-label',`${trip.city}旅行照片`);
   index.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.trip===trip.id)));
  }
  trips.forEach(trip=>{
   const button=template.content.firstElementChild.cloneNode(true);
   button.dataset.trip=trip.id;
   button.setAttribute('aria-label',`选择${trip.city}旅程`);
   button.querySelector('.stamp-city').textContent=trip.latin;
   button.querySelector('.stamp-date').textContent=trip.city;
   button.addEventListener('click',()=>select(trip));
   index.appendChild(button);
  });
  select(trips[1]);
  if(globalThis.Tweak){
   const style=getComputedStyle(page);
   const state={paper:style.getPropertyValue('--paper').trim(),signal:style.getPropertyValue('--signal').trim()};
   const tweak=new Tweak({container:page,onChange:()=>{page.style.setProperty('--paper',state.paper);page.style.setProperty('--signal',state.signal);}});
   tweak.addColorPicker(state,'paper',{label:'页面底色',reference:'--paper'});
   tweak.addColorPicker(state,'signal',{label:'主色',reference:'--signal'});
  }
 });
})();
</script>
